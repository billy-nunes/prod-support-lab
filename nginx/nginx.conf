worker_processes 1;
error_log /var/log/nginx/shop_error.log warn;

events {
    worker_connections 1024;
}

http {
    # One line per request, key=value, so grep/awk work without a JSON parser.
    #   rt  = total time nginx spent on the request
    #   urt = time waiting on the upstream (the app). "-" means nginx never got an answer.
    log_format kv '$time_iso8601 req_id=$request_id client=$remote_addr method=$request_method '
                  'path="$request_uri" status=$status bytes=$body_bytes_sent rt=$request_time '
                  'urt=$upstream_response_time upstream=$upstream_addr ua="$http_user_agent"';
    access_log /var/log/nginx/shop_access.log kv;

    # Re-resolve the app's container IP, so a recreated app container is found again.
    resolver 127.0.0.11 valid=10s ipv6=off;

    server {
        listen 80;

        location = /nginx_status {
            stub_status;
            access_log off;
        }

        location / {
            set $shop_api http://app:8000;
            proxy_pass $shop_api;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Request-ID $request_id;
            proxy_connect_timeout 2s;
            proxy_read_timeout 10s;    # app slower than this = 504 Gateway Timeout
            add_header X-Request-ID $request_id always;
        }
    }
}
